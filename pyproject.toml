[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-importer"
version = "0.1.0"
description = "Import recipes from public URLs, images, or pasted text into Paprika 3"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.8.0",
    "recipe-scrapers>=15.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=1.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "authlib>=1.3.0",
    "PyJWT>=2.8.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "cryptography>=42.0.0",
    "yt-dlp[default,deno]>=2025.8.22",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[project.scripts]
recipe-importer = "recipe_importer.cli:cli"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["recipe_importer*"]
