[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-importer"
version = "0.1.0"
description = "Import recipes from URLs or photos into Paprika 3 format"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "recipe-scrapers>=15.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=1.12.0",
]

[project.scripts]
recipe-importer = "recipe_importer.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
